name: Taiwan Stock Update

on:
  workflow_dispatch:

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Run script
        run: |
          python stock_update.py

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: momentum-ranking
          path: momentum_ranking.csv
